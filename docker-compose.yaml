version: '3.8'

services:
  crawler:
    image: ghcr.io/${GITHUB_USER:-user}/${GITHUB_REPO:-repo}:latest
    container_name: antispam-crawler
    ports:
      - "3000:3000"
    environment:
      # OpenAI兼容接口配置
      - AI_API_BASE=${AI_API_BASE:-https://api.openai.com/v1}
      - AI_API_KEY=${AI_API_KEY:-sk-xxxx}
      - AI_MODEL=${AI_MODEL:-gpt-4o}
    volumes:
      - ./:/app/screenshots
    restart: on-failure