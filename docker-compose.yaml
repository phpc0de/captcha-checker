version: '3.8'

services:
  captcha-checker:
    image: ghcr.io/phpc0de/captcha-checker:latest
    container_name: captcha-checker
    ports:
      - "3330:3330"
    environment:
      # OpenAI兼容接口配置
      - AI_API_BASE=${AI_API_BASE:-https://api.openai.com/v1}
      - AI_API_KEY=${AI_API_KEY:-sk-xxxx}
      - AI_MODEL=${AI_MODEL:-gpt-4o}
    volumes:
      - ./screenshots:/app/screenshots
    restart: on-failure
